name: Build Android Player Codec AAR (FFmpeg + LibVLC)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional FFmpeg stable release tag (e.g. n9.0.2). Empty = newest.'
        required: false
        type: string
      libvlc_version:
        description: 'Optional stable LibVLC version (e.g. 3.7.7). Empty = newest.'
        required: false
        type: string
      force:
        description: 'Rebuild and replace the existing Release assets'
        required: false
        default: false
        type: boolean
  # 05:00 KST = 20:00 UTC on the previous calendar day.
  schedule:
    - cron: '0 20 * * *'
  push:
    branches: [main]
    paths:
      - 'codec/**'
      - 'scripts/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-aar.yml'

permissions:
  contents: read

concurrency:
  group: android-codec-${{ github.ref }}
  cancel-in-progress: false

env:
  FFMPEG_BASELINE_VERSION: '9.0.2'
  NDK_VERSION: '28.2.13676358'
  CODEC_VERSION: '0.2.0'
  LIBVLC_BASELINE_VERSION: '3.7.7'

jobs:
  resolve:
    name: Check newest FFmpeg stable tag and existing Release
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      build: ${{ steps.check.outputs.build }}
      ffmpeg_version: ${{ steps.check.outputs.ffmpeg_version }}
      libvlc_version: ${{ steps.check.outputs.libvlc_version }}
      release_tag: ${{ steps.check.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test version comparator and no-op policy
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Resolve latest FFmpeg and decide whether to build
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_LIBVLC_VERSION: ${{ inputs.libvlc_version }}
          FORCE_BUILD: ${{ inputs.force || 'false' }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python3 scripts/resolve_release.py
  build-native:
    needs: [resolve]
    if: needs.resolve.outputs.build == 'true'
    env:
      FFMPEG_VERSION: ${{ needs.resolve.outputs.ffmpeg_version }}
    name: FFmpeg ${{ matrix.abi }}
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y patchelf pkg-config yasm nasm make
      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -1)"
          test -n "$sdkmanager"
          yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null || true
          "$sdkmanager" --sdk_root="$sdk_root" --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Checkout pinned FFmpeg source
        run: |
          mkdir -p work
          git clone --branch "n${FFMPEG_VERSION}" --depth 1 --single-branch \
            https://github.com/FFmpeg/FFmpeg.git "work/ffmpeg-${FFMPEG_VERSION}"
          git -C "work/ffmpeg-${FFMPEG_VERSION}" rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Build FFmpeg decoder libraries
        env:
          BUILD_JOBS: '2'
        run: FFMPEG_SOURCE_DIR="$PWD/work/ffmpeg-$FFMPEG_VERSION" bash scripts/build_ffmpeg.sh "${{ matrix.abi }}"
      - name: Upload ABI native libraries
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-bin-${{ matrix.abi }}
          path: codec/src/main/jniLibs/
          retention-days: 7
          if-no-files-found: error
      - name: Upload FFmpeg C headers (ARM64 source of truth)
        if: matrix.abi == 'arm64-v8a'
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-headers
          path: codec/src/main/ffmpeg-include/
          retention-days: 7
          if-no-files-found: error
  libvlc:
    name: Retrieve and verify official LibVLC AAR
    needs: [resolve]
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LIBVLC_VERSION: ${{ needs.resolve.outputs.libvlc_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Download official stable VideoLAN AAR and Maven POM
        run: |
          set -euo pipefail
          python3 scripts/vendor_libvlc.py --version "$LIBVLC_VERSION" --output vendor
      - name: Verify four ABI architectures and ARM64 16 KiB ELF
        run: |
          python3 scripts/verify_libvlc.py "vendor/libvlc-all-${LIBVLC_VERSION}.aar" vendor/LIBVLC_VERIFICATION.json
      - uses: actions/upload-artifact@v4
        with:
          name: libvlc-${{ env.LIBVLC_VERSION }}
          path: vendor/
          retention-days: 7
          if-no-files-found: error
  aar:
    name: Package, verify, and upload AAR
    needs: [resolve, build-native, libvlc]
    if: needs.resolve.outputs.build == 'true'
    env:
      FFMPEG_VERSION: ${{ needs.resolve.outputs.ffmpeg_version }}
      LIBVLC_VERSION: ${{ needs.resolve.outputs.libvlc_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -1)"
          test -n "$sdkmanager"
          yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null || true
          "$sdkmanager" --sdk_root="$sdk_root" --install \
            'platforms;android-35' 'build-tools;35.0.0' \
            "ndk;${NDK_VERSION}" 'cmake;3.22.1'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-bin-*
          path: codec/src/main/jniLibs
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-headers
          path: codec/src/main/ffmpeg-include
      - uses: actions/download-artifact@v4
        with:
          name: libvlc-${{ env.LIBVLC_VERSION }}
          path: dist
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Confirm all FFmpeg libraries are included
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            python3 scripts/verify_shared_libs.py "codec/src/main/jniLibs/$abi" "$abi"
          done
      - name: Build release AAR
        run: gradle --no-daemon :codec:assembleRelease
      - name: Verify both AARs, create two-AAR bundle, and hash artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          ffmpeg_aar="android-player-codec-${CODEC_VERSION}-ffmpeg${FFMPEG_VERSION}.aar"
          libvlc_aar="libvlc-all-${LIBVLC_VERSION}.aar"
          cp codec/build/outputs/aar/codec-release.aar "dist/$ffmpeg_aar"
          python3 scripts/verify_aar.py "dist/$ffmpeg_aar" dist/FFMPEG_VERIFICATION.json
          python3 scripts/verify_libvlc.py "dist/$libvlc_aar" dist/LIBVLC_VERIFICATION.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("dist")
          ffmpeg = json.loads((root / "FFMPEG_VERIFICATION.json").read_text())
          ffmpeg["libvlc"] = json.loads((root / "LIBVLC_VERIFICATION.json").read_text())
          (root / "VERIFICATION.json").write_text(json.dumps(ffmpeg, indent=2) + "\n")
          for filename in ("FFMPEG_VERIFICATION.json", "LIBVLC_VERIFICATION.json"):
              (root / filename).unlink()
          PY
          printf 'FFmpeg=%s\nLibVLC=%s\nCodecPack=%s\nLibVLC_origin=VideoLAN_Maven_Central\nGitHub_Run=%s\n' \
            "$FFMPEG_VERSION" "$LIBVLC_VERSION" "$CODEC_VERSION" "$GITHUB_RUN_ID" > dist/BUILD_INFO.txt
          python3 scripts/package_bundle.py --dist dist --codec "$CODEC_VERSION" \
            --ffmpeg "$FFMPEG_VERSION" --libvlc "$LIBVLC_VERSION"
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: android-player-codec-${{ env.CODEC_VERSION }}-ffmpeg${{ env.FFMPEG_VERSION }}-libvlc${{ env.LIBVLC_VERSION }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Publish verified AAR
    if: needs.resolve.outputs.build == 'true'
    needs: [resolve, aar]
    env:
      FFMPEG_VERSION: ${{ needs.resolve.outputs.ffmpeg_version }}
      LIBVLC_VERSION: ${{ needs.resolve.outputs.libvlc_version }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-player-codec-${{ env.CODEC_VERSION }}-ffmpeg${{ env.FFMPEG_VERSION }}-libvlc${{ env.LIBVLC_VERSION }}
          path: dist
      - name: Ship the exact LGPL FFmpeg sources
        run: |
          set -euo pipefail
          git clone --branch "n${FFMPEG_VERSION}" --depth 1 --single-branch \
            https://github.com/FFmpeg/FFmpeg.git ffmpeg-source
          git -C ffmpeg-source archive --format=tar.gz --prefix="ffmpeg-${FFMPEG_VERSION}/" \
            HEAD > "dist/FFmpeg-source-${FFMPEG_VERSION}.tar.gz"
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Publish versioned release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="codec-v${CODEC_VERSION}-ffmpeg${FFMPEG_VERSION}-libvlc${LIBVLC_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "Android Codec ${CODEC_VERSION} / FFmpeg ${FFMPEG_VERSION} / LibVLC ${LIBVLC_VERSION}" \
              --notes 'Two-AAR codec bundle: FFmpeg AAR compiled on GitHub-hosted runners, official VideoLAN LibVLC AAR retrieved unchanged from Maven Central and checksum-verified. Four ABI presence/architecture checks; strict 16 KiB on FFmpeg and LibVLC ARM64; FFmpeg source, LibVLC POM/provenance and SHA256 included. Not a merged AAR or independently installable APK. LGPL and third-party licensing applies; no DRM guarantee.'
          fi
