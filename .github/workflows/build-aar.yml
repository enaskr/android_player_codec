name: Build Android Player Codec AAR (FFmpeg)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional FFmpeg stable release tag (e.g. n9.0.2). Empty = newest.'
        required: false
        type: string
      force:
        description: 'Rebuild and replace the existing Release assets'
        required: false
        default: false
        type: boolean
  # 05:00 KST = 20:00 UTC on the previous calendar day.
  schedule:
    - cron: '0 20 * * *'
  push:
    branches: [main]
    paths:
      - 'codec/**'
      - 'scripts/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-aar.yml'

permissions:
  contents: read

concurrency:
  group: android-codec-${{ github.ref }}
  cancel-in-progress: false

env:
  FFMPEG_BASELINE_VERSION: '9.0.2'
  NDK_VERSION: '28.2.13676358'
  CODEC_VERSION: '0.1.0'

jobs:
  resolve:
    name: Check newest FFmpeg stable tag and existing Release
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      build: ${{ steps.check.outputs.build }}
      ffmpeg_version: ${{ steps.check.outputs.ffmpeg_version }}
      release_tag: ${{ steps.check.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test version comparator and no-op policy
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Resolve latest FFmpeg and decide whether to build
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          FORCE_BUILD: ${{ inputs.force || 'false' }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python3 scripts/resolve_release.py
  build-native:
    needs: [resolve]
    if: needs.resolve.outputs.build == 'true'
    env:
      FFMPEG_VERSION: ${{ needs.resolve.outputs.ffmpeg_version }}
    name: FFmpeg ${{ matrix.abi }}
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y patchelf pkg-config yasm nasm make
      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -1)"
          test -n "$sdkmanager"
          yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null || true
          "$sdkmanager" --sdk_root="$sdk_root" --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Checkout pinned FFmpeg source
        run: |
          mkdir -p work
          git clone --branch "n${FFMPEG_VERSION}" --depth 1 --single-branch \
            https://github.com/FFmpeg/FFmpeg.git "work/ffmpeg-${FFMPEG_VERSION}"
          git -C "work/ffmpeg-${FFMPEG_VERSION}" rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Build FFmpeg decoder libraries
        env:
          BUILD_JOBS: '2'
        run: FFMPEG_SOURCE_DIR="$PWD/work/ffmpeg-$FFMPEG_VERSION" bash scripts/build_ffmpeg.sh "${{ matrix.abi }}"
      - name: Upload ABI native libraries
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-bin-${{ matrix.abi }}
          path: codec/src/main/jniLibs/
          retention-days: 7
          if-no-files-found: error
      - name: Upload FFmpeg C headers (ARM64 source of truth)
        if: matrix.abi == 'arm64-v8a'
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-headers
          path: codec/src/main/ffmpeg-include/
          retention-days: 7
          if-no-files-found: error
  aar:
    name: Package, verify, and upload AAR
    needs: [resolve, build-native]
    if: needs.resolve.outputs.build == 'true'
    env:
      FFMPEG_VERSION: ${{ needs.resolve.outputs.ffmpeg_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -1)"
          test -n "$sdkmanager"
          yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null || true
          "$sdkmanager" --sdk_root="$sdk_root" --install \
            'platforms;android-35' 'build-tools;35.0.0' \
            "ndk;${NDK_VERSION}" 'cmake;3.22.1'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-bin-*
          path: codec/src/main/jniLibs
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-headers
          path: codec/src/main/ffmpeg-include
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Confirm all FFmpeg libraries are included
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            python3 scripts/verify_shared_libs.py "codec/src/main/jniLibs/$abi" "$abi"
          done
      - name: Build release AAR
        run: gradle --no-daemon :codec:assembleRelease
      - name: Verify AAR ABI / JNI / 16 KiB ELF
        run: |
          mkdir -p dist
          cp codec/build/outputs/aar/codec-release.aar "dist/android-player-codec-${CODEC_VERSION}-ffmpeg${FFMPEG_VERSION}.aar"
          python3 scripts/verify_aar.py "dist/android-player-codec-${CODEC_VERSION}-ffmpeg${FFMPEG_VERSION}.aar" dist/VERIFICATION.json
          (cd dist && sha256sum *.aar > SHA256SUMS && sha256sum -c SHA256SUMS)
          printf 'FFmpeg=%s\nCodecPack=%s\n' "$FFMPEG_VERSION" "$CODEC_VERSION" > dist/BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-player-codec-${{ env.CODEC_VERSION }}-ffmpeg${{ env.FFMPEG_VERSION }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Publish verified AAR
    if: needs.resolve.outputs.build == 'true'
    needs: [resolve, aar]
    env:
      FFMPEG_VERSION: ${{ needs.resolve.outputs.ffmpeg_version }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-player-codec-${{ env.CODEC_VERSION }}-ffmpeg${{ env.FFMPEG_VERSION }}
          path: dist
      - name: Ship the exact LGPL FFmpeg sources
        run: |
          set -euo pipefail
          git clone --branch "n${FFMPEG_VERSION}" --depth 1 --single-branch \
            https://github.com/FFmpeg/FFmpeg.git ffmpeg-source
          git -C ffmpeg-source archive --format=tar.gz --prefix="ffmpeg-${FFMPEG_VERSION}/" \
            HEAD > "dist/FFmpeg-source-${FFMPEG_VERSION}.tar.gz"
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Publish versioned release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="codec-v${CODEC_VERSION}-ffmpeg${FFMPEG_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "Android Player Codec ${CODEC_VERSION} / FFmpeg ${FFMPEG_VERSION}" \
              --notes 'LGPL-only FFmpeg decoder pack; includes Native AAR, all four ABIs, 16 KiB alignment report, FFmpeg source and checksum. Requires Android app rebuild to integrate. No DRM support.'
          fi
