name: Build LibVLC-first single Android Codec Pack AAR

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional FFmpeg stable release tag (e.g. n9.0.2). Empty = newest.'
        required: false
        type: string
      libvlc_version:
        description: 'Optional stable LibVLC version (e.g. 3.7.7). Empty = newest.'
        required: false
        type: string
      force:
        description: 'Rebuild and replace the existing Release assets'
        required: false
        default: false
        type: boolean
  # 05:00 KST = 20:00 UTC on the previous calendar day.
  schedule:
    - cron: '0 20 * * *'
  push:
    branches: [main]
    paths:
      - 'codec/**'
      - 'scripts/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-aar.yml'

permissions:
  contents: read

concurrency:
  group: android-codec-${{ github.ref }}
  cancel-in-progress: false

env:
  FFMPEG_BASELINE_VERSION: '9.0.2'
  NDK_VERSION: '28.2.13676358'
  CODEC_VERSION: '0.3.0'
  LIBVLC_BASELINE_VERSION: '3.7.7'

jobs:
  resolve:
    name: Check newest FFmpeg stable tag and existing Release
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      build: ${{ steps.check.outputs.build }}
      ffmpeg_version: ${{ steps.check.outputs.ffmpeg_version }}
      libvlc_version: ${{ steps.check.outputs.libvlc_version }}
      release_tag: ${{ steps.check.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test version comparator and no-op policy
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Resolve latest FFmpeg and decide whether to build
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_LIBVLC_VERSION: ${{ inputs.libvlc_version }}
          FORCE_BUILD: ${{ inputs.force || 'false' }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python3 scripts/resolve_release.py
  build-native:
    needs: [resolve]
    if: needs.resolve.outputs.build == 'true'
    env:
      FFMPEG_VERSION: ${{ needs.resolve.outputs.ffmpeg_version }}
      FFMPEG_SUPPLEMENTAL_ONLY: 'true'
    name: Selective FFmpeg ${{ matrix.abi }}
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y patchelf pkg-config yasm nasm make
      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -1)"
          test -n "$sdkmanager"
          yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null || true
          "$sdkmanager" --sdk_root="$sdk_root" --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Checkout pinned FFmpeg source
        run: |
          mkdir -p work
          git clone --branch "n${FFMPEG_VERSION}" --depth 1 --single-branch \
            https://github.com/FFmpeg/FFmpeg.git "work/ffmpeg-${FFMPEG_VERSION}"
          git -C "work/ffmpeg-${FFMPEG_VERSION}" rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Build FFmpeg decoder libraries
        env:
          BUILD_JOBS: '2'
        run: FFMPEG_SOURCE_DIR="$PWD/work/ffmpeg-$FFMPEG_VERSION" bash scripts/build_ffmpeg.sh "${{ matrix.abi }}"
      - name: Upload ABI native libraries
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-bin-${{ matrix.abi }}
          path: codec/src/main/jniLibs/
          retention-days: 7
          if-no-files-found: error
      - name: Upload FFmpeg C headers (ARM64 source of truth)
        if: matrix.abi == 'arm64-v8a'
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-headers
          path: codec/src/main/ffmpeg-include/
          retention-days: 7
          if-no-files-found: error
  libvlc:
    name: Retrieve and verify official LibVLC AAR
    needs: [resolve]
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LIBVLC_VERSION: ${{ needs.resolve.outputs.libvlc_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Download official stable VideoLAN AAR and Maven POM
        run: |
          set -euo pipefail
          python3 scripts/vendor_libvlc.py --version "$LIBVLC_VERSION" --output vendor
      - name: Verify four ABI architectures and ARM64 16 KiB ELF
        run: |
          python3 scripts/verify_libvlc.py "vendor/libvlc-all-${LIBVLC_VERSION}.aar" vendor/LIBVLC_VERIFICATION.json
      - uses: actions/upload-artifact@v4
        with:
          name: libvlc-${{ env.LIBVLC_VERSION }}
          path: vendor/
          retention-days: 7
          if-no-files-found: error
  aar:
    name: Merge and verify LibVLC-first single AAR
    needs: [resolve, build-native, libvlc]
    if: needs.resolve.outputs.build == 'true'
    env:
      FFMPEG_VERSION: ${{ needs.resolve.outputs.ffmpeg_version }}
      LIBVLC_VERSION: ${{ needs.resolve.outputs.libvlc_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -1)"
          test -n "$sdkmanager"
          yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null || true
          "$sdkmanager" --sdk_root="$sdk_root" --install \
            'platforms;android-35' 'build-tools;35.0.0' \
            "ndk;${NDK_VERSION}" 'cmake;3.22.1'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-bin-*
          path: codec/src/main/jniLibs
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-headers
          path: codec/src/main/ffmpeg-include
      - uses: actions/download-artifact@v4
        with:
          name: libvlc-${{ env.LIBVLC_VERSION }}
          path: dist
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Confirm all FFmpeg libraries are included
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            python3 scripts/verify_shared_libs.py "codec/src/main/jniLibs/$abi" "$abi"
          done
      - name: Build selective FFmpeg fallback Java/JNI AAR
        run: gradle --no-daemon :codec:assembleRelease -PlibvlcVersion="$LIBVLC_VERSION"
      - name: Assemble and validate single LibVLC-primary Codec Pack AAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          native_name="android-player-codec-pack-${CODEC_VERSION}-ffmpeg${FFMPEG_VERSION}-libvlc${LIBVLC_VERSION}.aar"
          addon="codec/build/outputs/aar/codec-release.aar"
          vlc="dist/libvlc-all-${LIBVLC_VERSION}.aar"
          # Reject publishing if the embedded LibVLC original or the
          # standalone FFmpeg native/JNI output fails its own checks.
          python3 scripts/verify_aar.py "$addon" dist/FFMPEG_EXTENSION_VERIFICATION.json
          python3 scripts/verify_libvlc.py "$vlc" dist/LIBVLC_VERIFICATION.json
          python3 scripts/merge_aar.py --libvlc "$vlc" --ffmpeg "$addon" \
            --metadata scripts/supplemental-codecs.json --output "dist/$native_name"
          mv "dist/${native_name%.aar}.merge.json" dist/MERGE_INFO.json
          python3 scripts/verify_unified_aar.py --aar "dist/$native_name" \
            --libvlc "$vlc" --ffmpeg "$addon" --report dist/VERIFICATION.json
          cp scripts/supplemental-codecs.json dist/SUPPLEMENTAL_CODECS.json
          cp docs/SINGLE_AAR_KO.md dist/README-CODEC-PACK.md
          printf 'CodecPack=%s\nPrimary=LibVLC\nLibVLC=%s\nFFmpeg=%s\nSupplemental=vvc,apv,qoa\nRunner=GitHub-hosted\nGitHub_Run=%s\n' \
            "$CODEC_VERSION" "$LIBVLC_VERSION" "$FFMPEG_VERSION" "$GITHUB_RUN_ID" > dist/BUILD_INFO.txt
          # Ship ONE AAR. Keep Maven POM/provenance/verification as metadata.
          rm "$vlc" dist/FFMPEG_EXTENSION_VERIFICATION.json dist/LIBVLC_VERIFICATION.json
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: android-codec-pack-${{ env.CODEC_VERSION }}-ffmpeg${{ env.FFMPEG_VERSION }}-libvlc${{ env.LIBVLC_VERSION }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Publish verified single Codec Pack AAR
    if: needs.resolve.outputs.build == 'true'
    needs: [resolve, aar]
    env:
      FFMPEG_VERSION: ${{ needs.resolve.outputs.ffmpeg_version }}
      LIBVLC_VERSION: ${{ needs.resolve.outputs.libvlc_version }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-codec-pack-${{ env.CODEC_VERSION }}-ffmpeg${{ env.FFMPEG_VERSION }}-libvlc${{ env.LIBVLC_VERSION }}
          path: dist
      - name: Ship the exact LGPL FFmpeg sources
        run: |
          set -euo pipefail
          git clone --branch "n${FFMPEG_VERSION}" --depth 1 --single-branch \
            https://github.com/FFmpeg/FFmpeg.git ffmpeg-source
          git -C ffmpeg-source archive --format=tar.gz --prefix="ffmpeg-${FFMPEG_VERSION}/" \
            HEAD > "dist/FFmpeg-source-${FFMPEG_VERSION}.tar.gz"
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Publish versioned release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="codec-v${CODEC_VERSION}-ffmpeg${FFMPEG_VERSION}-libvlc${LIBVLC_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --notes 'LibVLC-first single AAR. VideoLAN original Java/native/resources retained, selectively built FFmpeg VVC/APV/QOA fallback candidates merged. Supplement codecs are NOT proven universally absent from LibVLC. GitHub-hosted-only build, JNI and ELF validation; Android device runtime not tested.'
          else
            gh release create "$tag" dist/* \
              --title "Single Android Codec Pack ${CODEC_VERSION} (LibVLC ${LIBVLC_VERSION} + selective FFmpeg)" \
              --notes 'One physical LibVLC-primary AAR containing original VideoLAN classes/resources/native binaries plus limited FFmpeg VVC/APV/QOA fallback decoder candidates. Actual LibVLC codec-delta is not provable from monolithic upstream binary; fallback is opt-in. All build steps run on GitHub-hosted Ubuntu, validated JNI/ELF, LGPL source and checksums supplied. Device playback/DRM compatibility untested.'
          fi
